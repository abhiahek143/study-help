<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Together — watch &amp; talk</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://www.youtube.com">
<link rel="preconnect" href="https://www.google.com">
<link rel="preconnect" href="https://i.ytimg.com">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg: #0f1210;
    --panel: #171b18;
    --line: #2a302b;
    --text: #eef1ec;
    --muted: #8f9a90;
    --accent: #ffb454;
    --accent-dim: #6b5a34;
    --danger: #e0654f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  header{
    padding:20px 24px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
  }
  header h1{
    font-size:20px;
    margin:0;
    font-weight:600;
    letter-spacing:.2px;
  }
  header span.tag{
    color:var(--muted);
    font-size:13px;
  }
  .layout{
    display:grid;
    grid-template-columns: 1fr 300px;
    gap:0;
    min-height:calc(100vh - 66px);
  }
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
  }
  .stage{
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .player-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  #yt-player, #yt-player iframe{ width:100%; height:100%; display:block; }
  .load-row{
    display:flex;
    gap:8px;
  }
  .load-row input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 12px;
    border-radius:4px;
    font-size:14px;
  }
  .load-row input::placeholder{color:var(--muted);}
  button{
    background:var(--accent);
    color:#1a1508;
    border:none;
    padding:10px 16px;
    border-radius:4px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  button:hover{filter:brightness(1.08);}
  button.secondary{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
  }
  button:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .sidebar{
    border-left:1px solid var(--line);
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .block{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .block h2{
    font-size:12px;
    color:var(--muted);
    margin:0 0 2px;
    font-weight:600;
  }
  .id-box{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px 12px;
    font-family:monospace;
    font-size:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .id-box code{color:var(--accent); word-break:break-all;}
  .status{
    font-size:13px;
    color:var(--muted);
  }
  .status.live{color:#8bd28e;}
  .videos{
    display:flex;
    gap:8px;
  }
  .video-tile{
    flex:1;
    aspect-ratio:4/3;
    background:#000;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
    position:relative;
  }
  .video-tile video{width:100%;height:100%;object-fit:cover;background:#000;transform:translateZ(0);}
  .video-tile span{
    position:absolute;
    bottom:4px;
    left:6px;
    font-size:11px;
    color:var(--muted);
    background:rgba(0,0,0,.5);
    padding:1px 5px;
    border-radius:3px;
  }
  .connect-row{display:flex; gap:8px;}
  .connect-row input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 10px;
    border-radius:4px;
    font-family:monospace;
    font-size:13px;
  }
  .call-timer{
    align-self:flex-start;
    color:var(--muted);
    font-family:monospace;
    font-size:13px;
  }
</style>
</head>
<body>

<header>
  <h1>Together</h1>
  <span class="tag">talk while you watch — nothing stored, nothing billed</span>
</header>

<div class="layout">

  <div class="stage">
    <div class="load-row">
      <input id="ytInput" placeholder="Paste a YouTube link or video ID, then press Load" />
      <button id="loadBtn">Load</button>
    </div>
    <div class="player-wrap">
      <div id="yt-player"></div>
    </div>
  </div>

  <div class="sidebar">

    <div class="block">
      <h2>Room code</h2>
      <div class="connect-row">
        <input id="roomInput" placeholder="e.g. movienight" />
        <button id="joinBtn">Join</button>
      </div>
      <div class="status" id="peerStatus">Enter a room code — whoever types the same one lands in the same room.</div>
      <button class="secondary" id="leaveBtn" style="align-self:flex-start; display:none;">Leave room</button>
    </div>

    <div class="block">
      <h2>Video call</h2>
      <div class="videos">
        <div class="video-tile">
          <video id="localVideo" autoplay muted playsinline></video>
          <span>You</span>
        </div>
        <div class="video-tile">
          <video id="remoteVideo" autoplay playsinline muted></video>
          <span>Friend</span>
        </div>
      </div>
      <button class="secondary" id="unmuteBtn" style="align-self:flex-start;">Unmute friend</button>
      <div class="call-timer" id="callTimer">00:00</div>
    </div>

  </div>
</div>

<script>
/* ---------- PeerJS setup ---------- */
let peer, localStream, mediaConn, dataConn, roomHostId, role;
const peerStatusEl = document.getElementById('peerStatus');
const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');
const roomInput = document.getElementById('roomInput');
const leaveBtn = document.getElementById('leaveBtn');
const joinBtn = document.getElementById('joinBtn');
const unmuteBtn = document.getElementById('unmuteBtn');
const callTimer = document.getElementById('callTimer');
const ytInput = document.getElementById('ytInput');
const loadBtn = document.getElementById('loadBtn');
const PREFERRED_YT_QUALITY = 'hd720';
const MEDIA_CONSTRAINTS = {
  video: {
    width: { ideal: 1280 },
    height: { ideal: 720 },
    frameRate: { ideal: 30, max: 30 },
    facingMode: 'user'
  },
  audio: {
    echoCancellation: true,
    noiseSuppression: true,
    autoGainControl: true
  }
};

let callStartedAt = 0;
let callTimerId;

function formatCallDuration(totalSeconds){
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);
  const seconds = totalSeconds % 60;
  if(hours){
    return hours + ':' + String(minutes).padStart(2,'0') + ':' + String(seconds).padStart(2,'0');
  }
  return String(minutes).padStart(2,'0') + ':' + String(seconds).padStart(2,'0');
}

function renderCallTimer(){
  const elapsed = callStartedAt ? Math.floor((Date.now() - callStartedAt) / 1000) : 0;
  callTimer.textContent = formatCallDuration(elapsed);
}

function startCallTimer(){
  if(callStartedAt) return;
  callStartedAt = Date.now();
  renderCallTimer();
  callTimerId = setInterval(renderCallTimer, 1000);
}

function resetCallTimer(){
  callStartedAt = 0;
  if(callTimerId){
    clearInterval(callTimerId);
    callTimerId = null;
  }
  renderCallTimer();
}

// Public STUN + a free public TURN relay, so calls still connect across
// mobile networks / strict NATs where plain STUN alone fails.
const ICE_CONFIG = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' }
  ]
};

function sanitizeRoom(code){
  return code.trim().toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,24);
}

async function ensureLocalStream(){
  if(localStream && localStream.active) return localStream;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    peerStatusEl.textContent = 'Camera/mic needs a secure browser context. Open this from localhost or HTTPS.';
    return null;
  }
  try{
    localStream = await navigator.mediaDevices.getUserMedia(MEDIA_CONSTRAINTS);
  }catch(e){
    try{
      localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
    }catch(err){
      peerStatusEl.textContent = 'Camera/mic blocked — video call disabled, watch-together still works.';
      return null;
    }
  }

  tuneLocalStream(localStream);
  localVideo.srcObject = localStream;
  localVideo.play().catch(()=>{});
  return localStream;
}

function tuneLocalStream(stream){
  const videoTrack = stream.getVideoTracks()[0];
  const audioTrack = stream.getAudioTracks()[0];
  if(videoTrack && 'contentHint' in videoTrack) videoTrack.contentHint = 'motion';
  if(audioTrack && 'contentHint' in audioTrack) audioTrack.contentHint = 'speech';
}

function tuneMediaConnection(conn){
  if(!conn) return;

  const applySenderLimits = () => {
    const pc = conn.peerConnection || conn._pc;
    if(!pc || !pc.getSenders) return;

    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
    if(!sender || !sender.getParameters || !sender.setParameters) return;

    const params = sender.getParameters();
    if(!params.encodings || !params.encodings.length) params.encodings = [{}];
    params.encodings[0].maxBitrate = 1800000;
    params.encodings[0].maxFramerate = 30;
    sender.setParameters(params).catch(()=>{});
  };

  applySenderLimits();
  setTimeout(applySenderLimits, 800);
}

function attachRemoteStream(remoteStream){
  remoteVideo.srcObject = remoteStream;
  remoteVideo.play().catch(()=>{});
  startCallTimer();
}

function cleanupRoom(options = {}){
  const stopLocal = !!options.stopLocal;
  const resetStatus = options.resetStatus !== false;

  if(dataConn){ try{ dataConn.close(); }catch(e){} }
  if(mediaConn){ try{ mediaConn.close(); }catch(e){} }
  if(peer){ try{ peer.destroy(); }catch(e){} }

  dataConn = null;
  mediaConn = null;
  peer = null;
  roomHostId = null;
  role = null;
  remoteVideo.srcObject = null;
  remoteVideo.muted = true;
  unmuteBtn.textContent = 'Unmute friend';
  resetCallTimer();
  leaveBtn.style.display = 'none';

  if(stopLocal && localStream){
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
    localVideo.srcObject = localStream;
  }

  if(resetStatus) setStatus(false);
}

function bindPeerHandlers(){
  const activePeer = peer;

  activePeer.on('call', async call => {
    if(peer !== activePeer) return;
    const stream = await ensureLocalStream();
    if(peer !== activePeer) return;
    call.answer(stream || undefined);
    call.on('stream', remoteStream => {
      attachRemoteStream(remoteStream);
    });
    call.on('close', () => {
      if(mediaConn === call){
        remoteVideo.srcObject = null;
        resetCallTimer();
      }
    });
    mediaConn = call;
    tuneMediaConnection(call);
  });

  activePeer.on('connection', conn => {
    if(peer !== activePeer) return;
    dataConn = conn;
    dataConn.on('open', () => { setStatus(true); flushQueue(); });
    wireData(conn);
  });

  activePeer.on('disconnected', () => {
    if(peer === activePeer) setStatus(false, 'Disconnected — trying to reconnect…');
  });
  activePeer.on('close', () => {
    if(peer === activePeer) setStatus(false);
  });
}

// The first person to type a room code becomes the "room" itself (their
// Peer ID = the room code). Whoever types the same code next finds that ID
// already taken, so they connect to it as a guest instead — no manual ID
// copy-pasting needed on either side.
async function joinRoom(code){
  if(peer) cleanupRoom({ stopLocal:false, resetStatus:false });
  await ensureLocalStream();
  roomHostId = 'room-' + code;
  peerStatusEl.textContent = 'Joining "' + code + '"…';

  peer = new Peer(roomHostId, { config: ICE_CONFIG });
  bindPeerHandlers();

  peer.on('open', () => {
    role = 'host';
    peerStatusEl.textContent = 'Room "' + code + '" created — waiting for your friend to join…';
    leaveBtn.style.display = 'inline-block';
  });

  peer.on('error', err => {
    if(err.type === 'unavailable-id'){
      joinAsGuest(code, roomHostId);
    }else{
      peerStatusEl.textContent = 'Connection error: ' + err.type;
    }
  });
}

function joinAsGuest(code, hostId){
  const oldPeer = peer;
  if(oldPeer){ try{ oldPeer.destroy(); }catch(e){} }
  roomHostId = hostId;

  const guestId = hostId + '-' + Math.random().toString(36).slice(2, 8);
  peer = new Peer(guestId, { config: ICE_CONFIG });
  bindPeerHandlers();
  peerStatusEl.textContent = 'Room "' + code + '" found — connecting…';

  peer.on('open', () => {
    role = 'guest';
    leaveBtn.style.display = 'inline-block';

    if(localStream){
      const call = peer.call(roomHostId, localStream);
      mediaConn = call;
      call.on('stream', remoteStream => {
        attachRemoteStream(remoteStream);
      });
      call.on('close', () => {
        if(mediaConn === call){
          remoteVideo.srcObject = null;
          resetCallTimer();
        }
      });
      tuneMediaConnection(call);
    }

    dataConn = peer.connect(roomHostId, { reliable:true });
    dataConn.on('open', () => { setStatus(true); flushQueue(); });
    wireData(dataConn);
  });

  peer.on('error', err => {
    peerStatusEl.textContent = 'Connection error: ' + err.type;
  });
}

joinBtn.onclick = () => {
  const code = sanitizeRoom(roomInput.value);
  if(!code){ alert('Type a room code first.'); return; }
  joinRoom(code);
};

leaveBtn.onclick = () => {
  cleanupRoom({ stopLocal:true });
  peerStatusEl.textContent = 'Enter a room code — whoever types the same one lands in the same room.';
};

unmuteBtn.onclick = () => {
  remoteVideo.muted = !remoteVideo.muted;
  unmuteBtn.textContent = remoteVideo.muted ? 'Unmute friend' : 'Mute friend';
  remoteVideo.play().catch(()=>{});
};

function setStatus(live, message){
  peerStatusEl.textContent = message || (live ? 'Connected' : 'Disconnected');
  peerStatusEl.className = 'status' + (live ? ' live' : '');
}

/* ---------- Data channel: sync YouTube playback ---------- */
let applyingRemote = false; // guards against echoing our own sync back out
let outQueue = [];   // messages waiting for the data channel to open
let inQueue = [];    // incoming messages that arrived before the player was ready
let remoteApplyTimer;
let playbackMonitorId;
let lastMonitorAt = 0;
const wiredDataConnections = new WeakSet();

function wireData(conn = dataConn){
  if(!conn || wiredDataConnections.has(conn)) return;
  wiredDataConnections.add(conn);

  conn.on('data', msg => {
    if(!player || !playerReady){ inQueue.push(msg); return; }
    applyIncoming(msg);
  });
  conn.on('close', () => {
    if(dataConn === conn) setStatus(false);
  });
}

function applyIncoming(msg){
  if(!msg || !msg.type) return;
  applyingRemote = true;
  clearTimeout(remoteApplyTimer);

  if(msg.type === 'load'){
    loadYouTubeVideo(msg.videoId, msg.time || 0);
  } else if(msg.type === 'play'){
    player.seekTo(msg.time, true);
    player.playVideo();
  } else if(msg.type === 'pause'){
    player.seekTo(msg.time, true);
    player.pauseVideo();
  } else if(msg.type === 'seek'){
    player.seekTo(msg.time, true);
  }

  if(typeof msg.time === 'number') lastKnownTime = msg.time;
  remoteApplyTimer = setTimeout(()=> applyingRemote = false, 600);
}

function flushQueue(){
  if(dataConn && dataConn.open){
    while(outQueue.length) dataConn.send(outQueue.shift());
  }
}

function queueSync(payload){
  if(payload.type === 'load'){
    outQueue = [];
  } else if(payload.type === 'play' || payload.type === 'pause' || payload.type === 'seek'){
    outQueue = outQueue.filter(msg => msg.type === 'load');
  }
  outQueue.push(payload);
  if(outQueue.length > 6) outQueue = outQueue.slice(-6);
}

function sendSync(payload){
  if(applyingRemote) return;
  if(dataConn && dataConn.open){
    dataConn.send(payload);
  }else{
    queueSync(payload); // sent as soon as the connection opens
  }
}

/* ---------- YouTube IFrame player ---------- */
let player;
let playerReady = false;
let lastKnownTime = 0;

function buildPlayerVars(){
  const vars = { rel:0, modestbranding:1, playsinline:1, iv_load_policy:3, enablejsapi:1 };
  if(window.location.protocol === 'http:' || window.location.protocol === 'https:'){
    vars.origin = window.location.origin;
  }
  return vars;
}

function onYouTubeIframeAPIReady(){
  player = new YT.Player('yt-player', {
    height: '100%',
    width: '100%',
    playerVars: buildPlayerVars(),
    events: {
      onReady: () => {
        playerReady = true;
        preferPlaybackQuality();
        startPlaybackMonitor();
        while(inQueue.length) applyIncoming(inQueue.shift());
      },
      onStateChange: onPlayerStateChange
    }
  });
}
const ytTag = document.createElement('script');
ytTag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(ytTag);

function preferPlaybackQuality(){
  if(!player || !player.setPlaybackQuality) return;
  try{ player.setPlaybackQuality(PREFERRED_YT_QUALITY); }catch(e){}
}

function loadYouTubeVideo(videoId, startSeconds = 0){
  const request = { videoId, suggestedQuality: PREFERRED_YT_QUALITY };
  if(startSeconds > 0) request.startSeconds = startSeconds;
  player.loadVideoById(request);
  preferPlaybackQuality();
}

function onPlayerStateChange(e){
  if(applyingRemote) return;
  const time = player.getCurrentTime();
  if(e.data === YT.PlayerState.PLAYING){
    preferPlaybackQuality();
    sendSync({ type:'play', time });
  } else if(e.data === YT.PlayerState.PAUSED){
    sendSync({ type:'pause', time });
  }
  lastKnownTime = time;
  lastMonitorAt = performance.now();
}

function startPlaybackMonitor(){
  if(playbackMonitorId) return;
  playbackMonitorId = setInterval(() => {
    if(!player || !playerReady || applyingRemote) return;

    const state = player.getPlayerState();
    const time = player.getCurrentTime();
    const now = performance.now();
    const elapsed = lastMonitorAt ? (now - lastMonitorAt) / 1000 : 0;
    const actualDelta = time - lastKnownTime;
    const expectedDelta = state === YT.PlayerState.PLAYING ? elapsed : 0;
    const jumped = state === YT.PlayerState.PLAYING
      ? Math.abs(actualDelta - expectedDelta) > 1.5
      : Math.abs(actualDelta) > 0.75;

    if(jumped && dataConn && dataConn.open){
      sendSync({ type:'seek', time });
    }

    lastKnownTime = time;
    lastMonitorAt = now;
  }, 1000);
}

function cleanVideoId(id){
  return /^[\w-]{11}$/.test(id || '') ? id : null;
}

function isExpectedYouTubeHost(host, root){
  return host === root || host.endsWith('.' + root);
}

function extractVideoId(input){
  const value = input.trim();
  if(cleanVideoId(value)) return value;

  try{
    const url = new URL(value);
    const host = url.hostname.replace(/^www\./, '').replace(/^m\./, '');
    const parts = url.pathname.split('/').filter(Boolean);

    if(host === 'youtu.be') return cleanVideoId(parts[0]);
    if(isExpectedYouTubeHost(host, 'youtube.com') || isExpectedYouTubeHost(host, 'youtube-nocookie.com')){
      const queryId = cleanVideoId(url.searchParams.get('v'));
      if(queryId) return queryId;

      if(parts[0] === 'embed' || parts[0] === 'shorts' || parts[0] === 'live'){
        return cleanVideoId(parts[1]);
      }
    }
  }catch(e){
    const match = value.match(/(?:v=|\/)([\w-]{11})(?:[?&#/]|$)/);
    if(match) return cleanVideoId(match[1]);
  }

  return null;
}

loadBtn.onclick = () => {
  const raw = ytInput.value;
  const id = extractVideoId(raw);
  if(!id){ alert('Could not read a video ID from that link.'); return; }
  if(!player || !playerReady){ alert('Player is still loading, try again in a second.'); return; }
  loadYouTubeVideo(id);
  sendSync({ type:'load', videoId:id });
};

</script>

</body>
</html>
