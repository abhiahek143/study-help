<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Together — watch &amp; talk</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg: #0f1210;
    --panel: #171b18;
    --line: #2a302b;
    --text: #eef1ec;
    --muted: #8f9a90;
    --accent: #ffb454;
    --accent-dim: #6b5a34;
    --danger: #e0654f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height:100vh;
  }
  header{
    padding:20px 24px 14px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
  }
  header h1{
    font-size:20px;
    margin:0;
    font-weight:600;
    letter-spacing:.2px;
  }
  header span.tag{
    color:var(--muted);
    font-size:13px;
  }
  .layout{
    display:grid;
    grid-template-columns: 1fr 300px;
    gap:0;
    min-height:calc(100vh - 66px);
  }
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
  }
  .stage{
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .player-wrap{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:#000;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  #yt-player{ width:100%; height:100%; }
  .load-row{
    display:flex;
    gap:8px;
  }
  .load-row input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:10px 12px;
    border-radius:4px;
    font-size:14px;
  }
  .load-row input::placeholder{color:var(--muted);}
  button{
    background:var(--accent);
    color:#1a1508;
    border:none;
    padding:10px 16px;
    border-radius:4px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
  }
  button:hover{filter:brightness(1.08);}
  button.secondary{
    background:transparent;
    border:1px solid var(--line);
    color:var(--text);
  }
  button:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .sidebar{
    border-left:1px solid var(--line);
    padding:24px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  .block{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .block h2{
    font-size:12px;
    color:var(--muted);
    margin:0 0 2px;
    font-weight:600;
  }
  .id-box{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    padding:10px 12px;
    font-family:monospace;
    font-size:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
  }
  .id-box code{color:var(--accent); word-break:break-all;}
  .status{
    font-size:13px;
    color:var(--muted);
  }
  .status.live{color:#8bd28e;}
  .videos{
    display:flex;
    gap:8px;
  }
  .video-tile{
    flex:1;
    aspect-ratio:4/3;
    background:#000;
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
    position:relative;
  }
  .video-tile video{width:100%;height:100%;object-fit:cover;}
  .video-tile span{
    position:absolute;
    bottom:4px;
    left:6px;
    font-size:11px;
    color:var(--muted);
    background:rgba(0,0,0,.5);
    padding:1px 5px;
    border-radius:3px;
  }
  .connect-row{display:flex; gap:8px;}
  .connect-row input{
    flex:1;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 10px;
    border-radius:4px;
    font-family:monospace;
    font-size:13px;
  }
</style>
</head>
<body>

<header>
  <h1>Together</h1>
  <span class="tag">talk while you watch — nothing stored, nothing billed</span>
</header>

<div class="layout">

  <div class="stage">
    <div class="load-row">
      <input id="ytInput" placeholder="Paste a YouTube link or video ID, then press Load" />
      <button id="loadBtn">Load</button>
    </div>
    <div class="player-wrap">
      <div id="yt-player"></div>
    </div>
  </div>

  <div class="sidebar">

    <div class="block">
      <h2>Your ID</h2>
      <div class="id-box">
        <code id="myId">generating…</code>
        <button class="secondary" id="copyBtn">Copy</button>
      </div>
      <button class="secondary" id="newIdBtn" style="align-self:flex-start;">Generate new ID</button>
      <div class="status" id="peerStatus">Waiting for connection…</div>
    </div>

    <div class="block">
      <h2>Connect to a friend</h2>
      <div class="connect-row">
        <input id="friendId" placeholder="Paste their ID here" />
        <button id="connectBtn">Call</button>
      </div>
    </div>

    <div class="block">
      <h2>Video call</h2>
      <div class="videos">
        <div class="video-tile">
          <video id="localVideo" autoplay muted playsinline></video>
          <span>You</span>
        </div>
        <div class="video-tile">
          <video id="remoteVideo" autoplay playsinline muted></video>
          <span>Friend</span>
        </div>
      </div>
      <button class="secondary" id="unmuteBtn" style="align-self:flex-start;">Unmute friend</button>
    </div>

  </div>
</div>

<script>
/* ---------- PeerJS setup ---------- */
let peer, localStream, mediaConn, dataConn;
const myIdEl = document.getElementById('myId');
const peerStatusEl = document.getElementById('peerStatus');
const localVideo = document.getElementById('localVideo');
const remoteVideo = document.getElementById('remoteVideo');

/* Keep the same Peer ID across visits (stored in this browser) instead of
   a fresh random one every reload. "Generate new ID" clears it on demand. */
function getStoredId(){
  return localStorage.getItem('together-peer-id');
}
function makeShortId(){
  return 'twg-' + Math.random().toString(36).slice(2, 8);
}

async function initPeer(){
  try{
    localStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
    localVideo.srcObject = localStream;
  }catch(e){
    peerStatusEl.textContent = 'Camera/mic blocked — video call disabled, watch-together still works.';
  }

  let myId = getStoredId() || makeShortId();
  peer = new Peer(myId); // uses PeerJS free public broker, no server needed

  peer.on('open', id => {
    myIdEl.textContent = id;
    localStorage.setItem('together-peer-id', id);
  });

  peer.on('call', call => {
    call.answer(localStream);
    call.on('stream', remoteStream => {
      remoteVideo.srcObject = remoteStream;
      remoteVideo.play().catch(()=>{});
    });
    mediaConn = call;
    setStatus(true);
  });

  peer.on('connection', conn => {
    dataConn = conn;
    dataConn.on('open', () => { setStatus(true); flushQueue(); });
    wireData();
  });

  peer.on('error', err => {
    if(err.type === 'unavailable-id'){
      // stored ID got taken by a stale session elsewhere — fall back to a fresh one
      localStorage.removeItem('together-peer-id');
      peerStatusEl.textContent = 'That ID was taken, generating a fresh one…';
      setTimeout(initPeer, 300);
    }else{
      peerStatusEl.textContent = 'Connection error: ' + err.type;
    }
  });
}

document.getElementById('copyBtn').onclick = () => {
  navigator.clipboard.writeText(myIdEl.textContent);
  const b = document.getElementById('copyBtn');
  b.textContent = 'Copied';
  setTimeout(()=> b.textContent = 'Copy', 1200);
};

document.getElementById('newIdBtn').onclick = () => {
  localStorage.removeItem('together-peer-id');
  if(peer) peer.destroy();
  myIdEl.textContent = 'generating…';
  setStatus(false);
  initPeer();
};

document.getElementById('unmuteBtn').onclick = () => {
  remoteVideo.muted = !remoteVideo.muted;
  document.getElementById('unmuteBtn').textContent = remoteVideo.muted ? 'Unmute friend' : 'Mute friend';
  remoteVideo.play().catch(()=>{});
};

document.getElementById('connectBtn').onclick = () => {
  const friendId = document.getElementById('friendId').value.trim();
  if(!friendId) return;

  if(localStream){
    mediaConn = peer.call(friendId, localStream);
    mediaConn.on('stream', remoteStream => {
      remoteVideo.srcObject = remoteStream;
      remoteVideo.play().catch(()=>{});
    });
  }

  dataConn = peer.connect(friendId, { reliable:true });
  dataConn.on('open', () => { setStatus(true); flushQueue(); });
  wireData();
};

function setStatus(live){
  peerStatusEl.textContent = live ? 'Connected' : 'Waiting for connection…';
  peerStatusEl.className = 'status' + (live ? ' live' : '');
}

/* ---------- Data channel: sync YouTube playback ---------- */
let applyingRemote = false; // guards against echoing our own sync back out
let outQueue = [];   // messages waiting for the data channel to open
let inQueue = [];    // incoming messages that arrived before the player was ready

function wireData(){
  dataConn.on('data', msg => {
    if(!player || !playerReady){ inQueue.push(msg); return; }
    applyIncoming(msg);
  });
  dataConn.on('close', () => setStatus(false));
}

function applyIncoming(msg){
  applyingRemote = true;
  if(msg.type === 'load'){
    player.loadVideoById(msg.videoId);
  } else if(msg.type === 'play'){
    player.seekTo(msg.time, true);
    player.playVideo();
  } else if(msg.type === 'pause'){
    player.seekTo(msg.time, true);
    player.pauseVideo();
  } else if(msg.type === 'seek'){
    player.seekTo(msg.time, true);
  }
  setTimeout(()=> applyingRemote = false, 400);
}

function flushQueue(){
  if(dataConn && dataConn.open){
    while(outQueue.length) dataConn.send(outQueue.shift());
  }
}

function sendSync(payload){
  if(applyingRemote) return;
  if(dataConn && dataConn.open){
    dataConn.send(payload);
  }else{
    outQueue.push(payload); // sent as soon as the connection opens
  }
}

/* ---------- YouTube IFrame player ---------- */
let player;
let playerReady = false;
let lastKnownTime = 0;

function onYouTubeIframeAPIReady(){
  player = new YT.Player('yt-player', {
    height: '100%',
    width: '100%',
    playerVars: { rel:0, modestbranding:1 },
    events: {
      onReady: () => {
        playerReady = true;
        while(inQueue.length) applyIncoming(inQueue.shift());
      },
      onStateChange: onPlayerStateChange
    }
  });
}
const ytTag = document.createElement('script');
ytTag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(ytTag);

function onPlayerStateChange(e){
  if(applyingRemote) return;
  const time = player.getCurrentTime();
  if(e.data === YT.PlayerState.PLAYING){
    sendSync({ type:'play', time });
  } else if(e.data === YT.PlayerState.PAUSED){
    sendSync({ type:'pause', time });
  }
  lastKnownTime = time;
}

function extractVideoId(input){
  input = input.trim();
  const patterns = [
    /(?:youtu\.be\/)([\w-]{11})/,
    /(?:youtube\.com\/watch\?v=)([\w-]{11})/,
    /(?:youtube\.com\/embed\/)([\w-]{11})/
  ];
  for(const p of patterns){
    const m = input.match(p);
    if(m) return m[1];
  }
  if(/^[\w-]{11}$/.test(input)) return input;
  return null;
}

document.getElementById('loadBtn').onclick = () => {
  const raw = document.getElementById('ytInput').value;
  const id = extractVideoId(raw);
  if(!id){ alert('Could not read a video ID from that link.'); return; }
  if(!player || !playerReady){ alert('Player is still loading, try again in a second.'); return; }
  player.loadVideoById(id);
  sendSync({ type:'load', videoId:id });
};

initPeer();
</script>

</body>
</html>
