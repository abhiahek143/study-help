<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Sync — Watch Together</title>

<!-- PeerJS: free WebRTC signaling (uses PeerJS's free public cloud broker).
     Actual video/audio goes directly browser-to-browser (P2P) once
     connected — no call-time limit, no minutes cap. -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #1e1e2f;
    color: #f0f0f0;
  }
  header {
    padding: 14px 20px;
    background: #262640;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
  }
  #setup {
    max-width: 500px;
    margin: 60px auto;
    background: #262640;
    padding: 24px;
    border-radius: 10px;
  }
  #setup input {
    width: 100%;
    padding: 10px;
    margin: 8px 0 16px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
  }
  #setup button, .btn {
    background: #5865f2;
    color: white;
    border: none;
    padding: 10px 18px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  #setup button:hover, .btn:hover { background: #4752c4; }
  #app { display: none; }
  .main-layout {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    padding: 16px;
  }
  #youtube-col { flex: 2; min-width: 320px; }
  #call-col { flex: 1; min-width: 280px; }
  #player {
    width: 100%;
    aspect-ratio: 16/9;
    background: black;
    border-radius: 8px;
    overflow: hidden;
  }
  #call-frame-container {
    width: 100%;
    height: 360px;
    background: #000;
    border-radius: 8px;
    overflow: hidden;
    position: relative;
  }
  #remoteVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #000;
  }
  #localVideo {
    position: absolute;
    width: 100px;
    height: 75px;
    right: 10px;
    top: 10px;
    border-radius: 6px;
    object-fit: cover;
    border: 2px solid #5865f2;
    background: #111;
  }
  #callPlaceholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    color: #a0a0c0;
    text-align: center;
    padding: 20px;
  }
  .controls {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls input {
    flex: 1;
    min-width: 200px;
    padding: 8px;
    border-radius: 6px;
    border: none;
  }
  #status {
    margin-top: 10px;
    font-size: 13px;
    color: #a0a0c0;
  }
</style>
</head>
<body>

<header>
  <h1>📚 Study Sync</h1>
  <div id="statusBadge" style="font-size:13px; color:#a0a0c0;"></div>
</header>

<!-- STEP 1: Setup screen — enter a room name -->
<div id="setup">
  <h2>Join your study room</h2>
  <p style="font-size:13px; color:#c0c0d0;">
    No account needed. Just pick a room name — anything works, as long as
    both of you type the exact same name. Think of it like a shared password.
  </p>
  <label>Room Name</label>
  <input id="roomUrlInput" type="text" placeholder="e.g. abhi-study-room-42" />
  <label>Your Name</label>
  <input id="nameInput" type="text" placeholder="e.g. Alex" />
  <button id="joinBtn" class="btn">Join Room</button>
</div>

<!-- STEP 2: Main app (hidden until joined) -->
<div id="app">
  <div class="main-layout">
    <div id="youtube-col">
      <div id="player"></div>
      <div class="controls">
        <input id="ytUrlInput" type="text" placeholder="Paste a YouTube video URL and press Load" />
        <button id="loadVideoBtn" class="btn">Load</button>
      </div>
      <div id="status">Waiting for video...</div>
    </div>

    <div id="call-col">
      <div id="call-frame-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
        <div id="callPlaceholder">Waiting for your partner to join the room…</div>
      </div>
    </div>
  </div>
</div>

<script>
/* ======================================================
   STUDY SYNC — WebRTC (PeerJS) + YouTube IFrame API
   Free, no signup, no card, no call-time limit.
   Video/audio go directly browser-to-browser (P2P) once
   connected — PeerJS's free public server is only used to
   help the two browsers find each other (signaling).
   ====================================================== */

let peer = null;
let localStream = null;
let dataConn = null;      // WebRTC data channel, used for YT sync messages
let player = null;          // YouTube player instance
let ytApiReady = false;     // becomes true when YT API script loads
let pendingVideoId = null;  // video to load once player is ready

// This is the key to preventing infinite sync loops.
// A single boolean isn't enough — one seekTo()+play() call can trigger
// MULTIPLE state-change events (e.g. buffering, then playing), so a
// one-shot flag gets "used up" by the first event and the second one
// slips through and re-broadcasts, causing a play/pause ping-pong loop.
// Instead we suppress ALL outgoing broadcasts for a short time window
// after applying a remote action.
let suppressBroadcastUntil = 0;
const SUPPRESS_WINDOW_MS = 1500;

/* ---------- 1. Load the YouTube IFrame API dynamically ---------- */
function loadYouTubeAPI() {
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);
}

// Required global callback — YouTube API calls this automatically
// once it has finished loading.
window.onYouTubeIframeAPIReady = function () {
  ytApiReady = true;
  player = new YT.Player('player', {
    height: '100%',
    width: '100%',
    videoId: pendingVideoId || '',
    playerVars: { rel: 0 },
    events: {
      onStateChange: onPlayerStateChange
    }
  });
};

/* ---------- 2. Handle local play/pause events ---------- */
function onPlayerStateChange(event) {
  // If we're inside the suppression window (a remote sync action was just
  // applied), skip broadcasting entirely — otherwise we'd create an
  // infinite ping-pong between the two browsers.
  if (Date.now() < suppressBroadcastUntil) {
    return;
  }

  if (event.data === YT.PlayerState.PLAYING) {
    broadcast('play', player.getCurrentTime());
  } else if (event.data === YT.PlayerState.PAUSED) {
    broadcast('pause', player.getCurrentTime());
  }
}

/* ---------- 3. Send the sync message via the WebRTC data channel ---------- */
let lastBroadcast = { action: null, time: 0, at: 0 };

function broadcast(action, time) {
  if (!dataConn || !dataConn.open) return;

  // Extra safety: if we just sent this exact same action a moment ago,
  // don't send it again (guards against duplicate YT events firing back
  // to back for the same user action).
  const now = Date.now();
  if (
    lastBroadcast.action === action &&
    Math.abs(lastBroadcast.time - time) < 1 &&
    now - lastBroadcast.at < 800
  ) {
    return;
  }
  lastBroadcast = { action, time, at: now };

  dataConn.send({ type: 'yt-sync', action: action, time: time });
  setStatus(`You: ${action} @ ${time.toFixed(1)}s`);
}

function broadcastLoad(videoId) {
  if (!dataConn || !dataConn.open) return;
  dataConn.send({ type: 'yt-load', videoId: videoId });
}

/* ---------- 4. Receive sync messages from the other person ---------- */
function handleMessage(data) {
  if (!data || !player) return;

  if (data.type === 'yt-sync') {
    // Open the suppression window BEFORE applying the change, and keep
    // it open for SUPPRESS_WINDOW_MS so every state-change event this
    // triggers (buffering, playing, etc.) is ignored for broadcast.
    suppressBroadcastUntil = Date.now() + SUPPRESS_WINDOW_MS;

    player.seekTo(data.time, true);
    if (data.action === 'play') {
      player.playVideo();
    } else if (data.action === 'pause') {
      player.pauseVideo();
    }
    setStatus(`Partner: ${data.action} @ ${data.time.toFixed(1)}s`);
  }

  if (data.type === 'yt-load') {
    suppressBroadcastUntil = Date.now() + SUPPRESS_WINDOW_MS;
    player.loadVideoById(data.videoId);
    setStatus('Partner loaded a new video');
  }
}

/* ---------- 5. Load a video from a pasted YouTube URL ---------- */
function extractVideoId(url) {
  const match = url.match(/(?:v=|\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  return match ? match[1] : null;
}

function loadVideo(url) {
  const id = extractVideoId(url);
  if (!id) {
    alert('Could not read a video ID from that URL.');
    return;
  }
  if (player && ytApiReady) {
    player.loadVideoById(id);
    broadcastLoad(id);
  } else {
    pendingVideoId = id;
  }
}

/* ---------- 6. WebRTC call setup (PeerJS) ----------
   Two-person room pattern: the room name maps to a fixed "host" peer ID.
   Whoever opens the room first claims that ID and waits. The second
   person's ID is already taken, so they fall back to a random ID and
   call + data-connect to the host ID instead. This needs no backend of
   our own — PeerJS's free cloud signaling server just helps the two
   browsers exchange connection info; the media stream itself is
   peer-to-peer, so there's no time limit and no minutes cap. */
function joinCall(roomName, userName) {
  const hostId = 'studysync-' + roomName.trim().toLowerCase().replace(/\s+/g, '-');

  navigator.mediaDevices.getUserMedia({ video: true, audio: true })
    .then(stream => {
      localStream = stream;
      document.getElementById('localVideo').srcObject = stream;
      startPeer(hostId);
    })
    .catch(err => {
      console.error(err);
      alert('Camera/microphone access is needed for the video call. Please allow permissions and try again.');
    });
}

function startPeer(hostId) {
  peer = new Peer(hostId);

  peer.on('open', () => {
    // We successfully claimed the host ID — we're first in the room.
    setStatus('Waiting for your partner to join…');
  });

  // Someone calls us with their video/audio.
  peer.on('call', call => {
    call.answer(localStream);
    call.on('stream', remoteStream => onRemoteStream(remoteStream));
  });

  // Someone opens a data channel to us (for YT sync messages).
  peer.on('connection', conn => {
    dataConn = conn;
    dataConn.on('open', () => setStatus('Connected to call ✅'));
    dataConn.on('data', data => handleMessage(data));
  });

  peer.on('error', err => {
    if (err.type === 'unavailable-id') {
      // The host ID is already taken — someone's already in the room.
      // Become the "guest": get a random ID, then call + connect to host.
      becomeGuest(hostId);
    } else {
      console.error('PeerJS error:', err);
    }
  });
}

function becomeGuest(hostId) {
  peer = new Peer();

  peer.on('open', () => {
    const call = peer.call(hostId, localStream);
    call.on('stream', remoteStream => onRemoteStream(remoteStream));

    dataConn = peer.connect(hostId);
    dataConn.on('open', () => setStatus('Connected to call ✅'));
    dataConn.on('data', data => handleMessage(data));
  });

  peer.on('error', err => console.error('PeerJS error:', err));
}

function onRemoteStream(remoteStream) {
  document.getElementById('remoteVideo').srcObject = remoteStream;
  document.getElementById('callPlaceholder').style.display = 'none';
  setStatus('Connected to call ✅');
}

/* ---------- UI wiring ---------- */
function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

document.getElementById('joinBtn').addEventListener('click', () => {
  const roomName = document.getElementById('roomUrlInput').value.trim();
  const name = document.getElementById('nameInput').value.trim() || 'Guest';

  if (!roomName) {
    alert('Please enter a room name.');
    return;
  }

  document.getElementById('setup').style.display = 'none';
  document.getElementById('app').style.display = 'block';

  loadYouTubeAPI();
  joinCall(roomName, name);
});

document.getElementById('loadVideoBtn').addEventListener('click', () => {
  const url = document.getElementById('ytUrlInput').value.trim();
  if (url) loadVideo(url);
});
</script>

</body>
</html>
